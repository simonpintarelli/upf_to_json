[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "upf_to_json"
version = "1.2.0"
description = "upf to json converter"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{name = "Simon Pintarelli", email = "simon.pintarelli@cscs.ch"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = ["click"]

[project.optional-dependencies]
test = ["deepdiff", "pytest"]

[project.urls]
Homepage = "https://github.com/simonpintarelli/upf_to_json"

[project.scripts]
upf2json = "upf_to_json.cli:cli"

[tool.setuptools]
packages = ["upf_to_json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
